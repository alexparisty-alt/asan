function results(){var text=S.query.toLocaleLowerCase('fa');var items=P.filter(function(p){return (S.filter==='همه'||p.cat===S.filter)&&(p.name+' '+p.cat+' '+p.desc).toLocaleLowerCase('fa').includes(text)});return items.length?'<div class="grid">'+items.map(card).join('')+'</div>':'<div class="empty">محصولی پیدا نشد؛ عبارت دیگری جست‌وجو کنید.</div>'}
function shop(){return header()+'<div class="band"><div class="wrap"><h1>فروشگاه asan</h1><p>محصولات و سرویس‌های دیجیتال</p></div></div><main id="main" class="wrap shop"><aside class="side" aria-label="بخش‌های فروشگاه"><a class="active" href="#/shop">'+icon('bag')+' فروشگاه</a><a href="#/orders">'+icon('box')+' سفارش‌ها</a><a href="#/virtual">'+icon('phone')+' شماره مجازی</a><a href="#/service">'+icon('globe')+' سرویس ویژه</a></aside><div><div class="panel"><span class="eyebrow">فروشگاه asan</span><h1>محصول موردنیازت را پیدا کن</h1><p>دسته‌بندی، قیمت نمونه و وضعیت هر محصول مشخص است.</p><label class="search">'+icon('search')+'<input id="search" type="search" placeholder="جست‌وجوی محصول یا دسته‌بندی…" aria-label="جست‌وجوی محصول" value="'+safe(S.query)+'"></label><div class="filters">'+['همه'].concat(Array.from(new Set(P.map(function(p){return p.cat})))).map(function(f){return '<button class="filter '+(S.filter===f?'active':'')+'" data-action="filter" data-filter="'+safe(f)+'" aria-pressed="'+(S.filter===f)+'">'+safe(f)+'</button>'}).join('')+'</div></div><div class="note">قیمت و موجودی را مدیر سایت تنظیم می‌کند؛ خرید، پرداخت و پیامک هنوز فعال نیستند.</div><div class="promo"><div><b>سرویس‌های دیجیتال، یک‌جا</b><small>مرور خدمات روی موبایل و رایانه</small></div><a href="#/" data-section="services" class="button primary small">دسته‌بندی‌ها</a></div><div id="results">'+results()+'</div></div></main>'+footer()}

function currentContent(){return {products:P,categories:C,faqs:Q,hero:H}}
function copy(value){return JSON.parse(JSON.stringify(value))}
function applyContent(value){P=value.products;C=value.categories;Q=value.faqs;H=value.hero;S.cart=S.cart.filter(function(id){return P.some(function(p){return p.id===id})});save()}
function validText(s,max){return typeof s==='string'&&s.trim().length>0&&s.length<=max&&!/[<>]/.test(s)}
function validContent(c){
 if(!c||!Array.isArray(c.products)||c.products.length>100||!Array.isArray(c.categories)||c.categories.length>40||!Array.isArray(c.faqs)||c.faqs.length>100||!c.hero)return false;
 if(!['eyebrow','title','highlight','description'].every(function(k){return validText(c.hero[k],700)}))return false;
 var ids=new Set();
 if(!c.products.every(function(p){if(!p||!(/^[a-z0-9-]{1,40}$/.test(p.id))||ids.has(p.id)||!['name','cat','desc','delivery','warranty','mark'].every(function(k){return validText(p[k],k==='desc'?700:120)})||!['price','old','stock'].every(function(k){return Number.isSafeInteger(p[k])&&p[k]>=0})||p.old<1||p.old<p.price||!Array.isArray(p.colors)||p.colors.length!==2||!p.colors.every(function(x){return /^#[a-fA-F0-9]{6}$/.test(x)}))return false;ids.add(p.id);return true}))return false;
 return [c.categories,c.faqs].every(function(list,idx){return list.every(function(row){return Array.isArray(row)&&row.length===(idx===0?3:2)&&row.every(function(x){return validText(x,700)})})})
}
function useLocal(){S.mode='local';S.editable=true;try{var stored=JSON.parse(localStorage.getItem('asan-admin-content')||'null');if(validContent(stored))applyContent(stored)}catch(e){}S.draft=copy(currentContent());render()}
async function loadContent(){
 if(location.protocol==='file:'||location.hostname==='terminal.local'||!/^https?:$/.test(location.protocol)){useLocal();return}
 try{
  var response=await fetch('/api/content',{credentials:'same-origin',cache:'no-store'});
  if(response.status===404){useLocal();return}
  if(!response.ok)throw new Error('بارگذاری اطلاعات سایت با خطا روبه‌رو شد.');
  var result=await response.json();
  if(!validContent(result.content))throw new Error('قالب اطلاعات سایت معتبر نیست.');
  applyContent(result.content);S.revision=result.revision;S.editable=Boolean(result.editable);S.mode='online';S.draft=copy(currentContent());render()
 }catch(error){S.mode='error';S.status=error.message||'اتصال برقرار نشد.';render()}
}
function field(label,name,value,type,required){
 var v=safe(value===undefined?'':value);
 if(type==='textarea')return '<label class="field">'+label+'<textarea name="'+name+'" maxlength="700" '+(required?'required':'')+'>'+v+'</textarea></label>';
 return '<label class="field">'+label+'<input name="'+name+'" type="'+(type||'text')+'" value="'+v+'" '+(type==='number'?'min="0" step="1"':'maxlength="120"')+' '+(required?'required':'')+'></label>'
}

 p=p||{id:'',name:'',cat:'هوش مصنوعی',desc:'',price:0,old:1,stock:0,delivery:'',warranty:'',mark:'✦',colors:['#b75136','#e07855']};

}

function faqEditor(q){q=q||['',''];return '<h2>'+(S.editIndex<0?'پرسش جدید':'ویرایش پرسش')+'</h2><form id="admin-form" data-kind="faqs">'+field('پرسش','question',q[0],'text',true)+field('پاسخ','answer',q[1],'textarea',true)+'<button class="button primary" type="submit">ثبت در پیش‌نویس</button></form>'}
function heroEditor(){var h=S.draft.hero;return '<h2>متن صفحهٔ اصلی</h2><form id="admin-form" data-kind="hero">'+field('عنوان کوچک','eyebrow',h.eyebrow,'text',true)+field('تیتر اصلی','title',h.title,'text',true)+field('بخش رنگی تیتر','highlight',h.highlight,'text',true)+field('توضیح','description',h.description,'textarea',true)+'<button class="button primary" type="submit">ثبت در پیش‌نویس</button></form>'}

 }).join(''):'<div class="admin-empty">هنوز موردی ثبت نشده است.</div>')+'</div>'
}
function admin(){
 if(S.mode==='loading')return header()+'<main id="main" class="wrap legal panel"><h1>در حال بارگذاری پنل مدیریت…</h1></main>';
 if(S.mode==='error')return header()+'<main id="main" class="wrap legal panel"><h1>پنل فعلاً در دسترس نیست</h1><p>'+safe(S.status)+'</p><button class="button" data-action="admin-retry">تلاش دوباره</button></main>';
 if(!S.editable)return header()+'<main id="main" class="wrap legal panel"><h1>دسترسی مدیریت</h1><p>این بخش فقط برای حساب مالک سایت فعال است.</p><a href="#/" class="button">بازگشت به سایت</a></main>';
 if(!S.draft)S.draft=copy(currentContent());
 var titles={products:'محصولات و موجودی',categories:'دسته‌بندی خدمات',faqs:'پرسش‌های متداول',hero:'صفحهٔ اصلی'};
 var tabs=Object.keys(titles).map(function(key){return '<button data-action="admin-tab" data-tab="'+key+'" class="'+(S.tab===key?'active':'')+'">'+titles[key]+'</button>'}).join('');
 var editor=S.tab==='hero'?heroEditor():S.tab==='products'?productEditor(S.draft.products[S.editIndex]):S.tab==='categories'?categoryEditor(S.draft.categories[S.editIndex]):faqEditor(S.draft.faqs[S.editIndex]);
 return header()+'<main id="main" class="wrap admin-layout"><aside class="admin-side"><strong>مدیریت asan</strong>'+tabs+'<a href="#/">← مشاهده سایت</a></aside><section><div class="admin-head"><div><span class="eyebrow">'+(S.mode==='online'?'متصل به سایت آنلاین':'ویرایش در همین مرورگر')+'</span><h1>'+titles[S.tab]+'</h1><p>'+(S.mode==='online'?'با انتشار، تغییرات برای همهٔ بازدیدکنندگان سایت ثبت می‌شود.':'تغییرات آفلاین فقط روی همین دستگاه ذخیره می‌شوند؛ برای انتقال به سایت از خروجی و درون‌ریزی استفاده کنید.')+'</p></div><div class="admin-tools"><button class="button primary" data-action="admin-publish" '+(S.dirty&&!S.busy?'':'disabled')+'>'+(S.busy?'در حال ذخیره…':S.mode==='online'?'انتشار تغییرات':'ذخیره در مرورگر')+'</button><button class="button" data-action="admin-reset" '+(S.dirty?'':'disabled')+'>لغو پیش‌نویس</button><button class="button" data-action="admin-export">خروجی JSON</button><button class="button" data-action="admin-import">درون‌ریزی JSON</button><input id="admin-import-file" type="file" accept="application/json,.json" hidden></div></div>'+(S.dirty?'<div class="note">تغییرات پیش‌نویس هنوز '+(S.mode==='online'?'منتشر':'ذخیره')+' نشده‌اند.</div>':'')+(S.status?'<div class="note" role="status">'+safe(S.status)+'</div>':'')+'<div class="admin-content">'+(S.tab==='hero'?'<div class="admin-list"><h2>نمایش صفحهٔ اصلی</h2><p>عنوان و توضیح اصلی در سمت راست صفحهٔ نخست دیده می‌شوند.</p><a class="button" href="#/">پیش‌نمایش سایت</a></div>':adminRows())+'<div class="editor">'+editor+'</div></div><div class="admin-status">اطلاعات سفارش و پرداخت در این نسخه ثبت نمی‌شوند.</div></section></main>'+footer()
}
async function publishDraft(){
 if(!S.dirty||S.busy||!validContent(S.draft)){S.status='اطلاعات ناقص یا نامعتبر است.';render();return}
 S.busy=true;S.status='';render();
 try{
  if(S.mode==='online'){
   var response=await fetch('/api/content',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:S.revision,content:S.draft})});
   var result=await response.json();
   if(!response.ok)throw new Error(result.error||'ذخیره انجام نشد.');
   S.revision=result.revision;
  }else localStorage.setItem('asan-admin-content',JSON.stringify(S.draft));
  applyContent(copy(S.draft));S.dirty=false;S.status='تغییرات ذخیره شد.';toast(S.mode==='online'?'تغییرات سایت منتشر شد.':'تغییرات روی این دستگاه ذخیره شد.')
 }catch(error){S.status=error.message||'ذخیره انجام نشد.'}
 S.busy=false;render()
}
function exportDraft(){var blob=new Blob([JSON.stringify({content:S.draft},null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='asan-content.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function render(){var r=(location.hash||'#/').slice(1).split('?')[0];if(r[0]!=='/')r='/';S.route=r;var p=r.indexOf('/product/')===0?P.find(function(x){return x.id===r.split('/')[2]}):null;document.title=(p?p.name:r==='/shop'?'فروشگاه':r==='/faq'?'سوالات متداول':r==='/admin'?'پنل مدیریت':'asan')+' | asan';document.getElementById('app').innerHTML=(r==='/'?home():r==='/shop'?shop():r==='/admin'?admin():p?detail(p):info(r))+layer();document.body.style.overflow=(S.drawer||S.modal)?'hidden':''}
function save(){try{localStorage.setItem('asan-demo-cart',JSON.stringify(S.cart))}catch(e){}}
function toast(t){var old=document.querySelector('.toast');if(old)old.remove();var x=document.createElement('div');x.className='toast';x.role='status';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},3500)}
document.addEventListener('click',function(e){
 var a=e.target.closest('a[data-section]');if(a){var section=a.dataset.section;if(S.route==='/'){e.preventDefault();document.getElementById(section)?.scrollIntoView({behavior:'smooth'});S.mobile=false;return}S.pendingSection=section}
 var b=e.target.closest('[data-action]');if(!b)return;var v=b.dataset.action;
 if(v==='outside'&&e.target!==b)return;
 if(v==='mobile'){S.mobile=!S.mobile;render()}
 else if(v==='cart'){S.drawer=true;render()}
 else if(v==='login'||v==='notify'||v==='checkout'){S.drawer=false;S.modal=v;render()}
 else if(v==='outside'||v==='close'){S.drawer=false;S.modal='';render()}
 else if(v==='filter'){S.filter=b.dataset.filter;render()}
 else if(v==='add'){S.cart.push(b.dataset.id);save();render();toast('به سبد انتخاب‌ها اضافه شد.')}
 else if(v==='remove'){S.cart.splice(Number(b.dataset.index),1);save();render()}
 else if(v==='admin-retry'){S.mode='loading';S.status='';render();loadContent()}
 else if(!S.editable||S.mode==='loading'||S.mode==='error')return;
 else if(v==='admin-tab'){S.tab=b.dataset.tab;S.editIndex=-1;S.status='';render()}
 else if(v==='admin-new'){S.editIndex=-1;render()}
 else if(v==='admin-edit'){S.editIndex=Number(b.dataset.index);render()}
 else if(v==='admin-move'){var list=S.draft[S.tab],from=Number(b.dataset.index),to=from+Number(b.dataset.dir);if(to>=0&&to<list.length){var item=list.splice(from,1)[0];list.splice(to,0,item);S.editIndex=to;S.dirty=true;render()}}
 else if(v==='admin-remove'){var index=Number(b.dataset.index);if(window.confirm('این مورد از پیش‌نویس حذف شود؟')){S.draft[S.tab].splice(index,1);S.editIndex=-1;S.dirty=true;render()}}
 else if(v==='admin-reset'){S.draft=copy(currentContent());S.dirty=false;S.editIndex=-1;S.status='پیش‌نویس لغو شد.';render()}
 else if(v==='admin-publish'){publishDraft()}
 else if(v==='admin-export'){exportDraft()}
 else if(v==='admin-import'){document.getElementById('admin-import-file').click()}
});
document.addEventListener('input',function(e){if(e.target.id==='search'){S.query=e.target.value;document.getElementById('results').innerHTML=results()}});
document.addEventListener('submit',function(e){
 if(e.target.getAttribute('id')!=='admin-form')return;e.preventDefault();
 var form=e.target,values=Object.fromEntries(new FormData(form)),kind=form.dataset.kind,item;
 if(kind==='products')item={id:String(values.id).trim(),name:String(values.name).trim(),cat:String(values.cat).trim(),desc:String(values.desc).trim(),price:Number(values.price),old:Number(values.old),stock:Number(values.stock),delivery:String(values.delivery).trim(),warranty:String(values.warranty).trim(),mark:String(values.mark).trim(),colors:[String(values.color1),String(values.color2)]};
 else if(kind==='categories')item=[String(values.icon).trim(),String(values.title).trim(),String(values.description).trim()];
 else if(kind==='faqs')item=[String(values.question).trim(),String(values.answer).trim()];
 else item={eyebrow:String(values.eyebrow).trim(),title:String(values.title).trim(),highlight:String(values.highlight).trim(),description:String(values.description).trim()};
 var next=copy(S.draft);if(kind==='hero')next.hero=item;else if(S.editIndex<0)next[kind].push(item);else next[kind][S.editIndex]=item;
 if(!validContent(next)){S.status='اطلاعات فرم ناقص یا نامعتبر است؛ شناسه باید لاتین و یکتا باشد.';render();return}
 S.draft=next;S.editIndex=kind==='hero'?-1:next[kind].indexOf(item);S.dirty=true;S.status='در پیش‌نویس ثبت شد. برای اعمال تغییرات، دکمهٔ انتشار را بزنید.';render()
});
document.addEventListener('change',async function(e){
 if(e.target.id!=='admin-import-file'||!e.target.files?.[0])return;
 try{var file=e.target.files[0];if(file.size>200000)throw new Error('حجم فایل زیاد است.');var raw=JSON.parse(await file.text());var content=raw.content||raw;if(!validContent(content))throw new Error('قالب یا اطلاعات فایل معتبر نیست.');S.draft=copy(content);S.dirty=true;S.editIndex=-1;S.status='فایل در پیش‌نویس بارگذاری شد؛ برای اعمال آن انتشار را بزنید.'}catch(error){S.status=error.message||'فایل خوانده نشد.'}render()
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(S.drawer||S.modal)){S.drawer=false;S.modal='';render()}});
window.addEventListener('hashchange',function(){S.mobile=false;S.drawer=false;S.modal='';render();window.scrollTo(0,0);var sec=S.pendingSection;if(sec&&S.route==='/'){S.pendingSection='';setTimeout(function(){document.getElementById(sec)?.scrollIntoView()},50)}});
render();loadContent();
})();
